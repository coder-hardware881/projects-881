<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
        <script src="player.js" defer></script>
        <script src="sprite.js" defer></script>
        <style>
            body{
                font-family:'VT323',monospace;
                font-size: 120%;
            }
            h1{
                width: fit-content;
                margin: auto;
            }
            #trcanvas{
                position: absolute;
                z-index: -1;
                left:0;
                top:0;
            }
            #cont{
                width: 1000px;
                height: 400px;
                margin: auto;
                overflow: hidden;
                position: relative;
            }
            #cont > p{
                position: absolute;
                font-size: 150%;
                font-family: ebrima;
                top:40%;
                left:50%;
                transform: translate(-50%,-50%);
                height: fit-content;
                width: fit-content;
                animation:change 10s infinite ;
            }
            @keyframes change {
                0%,100%{
                    color:red;
                }
                33%{
                    color:green;
                }
                66%{
                    color:blue;
                }
            }
        </style>
    </head>
    <body>
        <div id="check">
        <p>Enter Birthday Date(for eg:31 December)</p>
        <input type="text"id="date">
        <button id="but">Submit</button>
        <a id="an"style="display: none;"href="sprite.html">Click</a>
        <script>
            document.getElementById("but").addEventListener('click',()=>{
                if(document.getElementById("date").value=="31 January"){document.getElementById('check').style="display:none";document.getElementById('main').style="display:block";requestAnimationFrame(render)}});
        </script></div><div id="main" style="display:none">
        <h1>Basketball</h1>
        <div id="cont">
            <canvas id="canvas"></canvas>
            <canvas id="trcanvas"></canvas>
            <p style="display:none">Happy Birthday Sus!</p>
        </div>
        </div>
        <img style="display:none;" id="spritesheet" src="basketball.png">
        <img style="display:none;" id="ball" src="ball.png">
    </body>
</html>
